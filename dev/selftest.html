<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-test</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #fff;
        color: #16181c;
        font: 15px system-ui, sans-serif;
      }
      #status {
        font-size: 20px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        display: inline-block;
      }
      .pass { background: #e6f5e9; color: #14532d; }
      .fail { background: #fcecec; color: #8e1f1f; }
      pre { font-size: 13px; }
      .row { display: flex; gap: 24px; align-items: flex-start; margin-top: 16px; }
      .row img { width: 220px; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <p id="status">Running…</p>
    <pre id="log"></pre>
    <div class="row">
      <figure><figcaption>Source</figcaption><img id="source" alt="" /></figure>
      <figure><figcaption>SVG</figcaption><img id="result" alt="" /></figure>
    </div>
    <script type="module">
      /**
       * Checks the whole chain in a real browser: building a PNG, decoding it
       * through the platform, transferring it to the worker, vectorizing, then
       * rendering the resulting SVG. Run `npm run dev`, then /dev/selftest.html.
       */
      import { decodeImage } from '/src/platform/decodeImage.ts';
      import { VectorizerClient } from '/src/platform/vectorizerClient.ts';
      import { DEFAULT_OPTIONS } from '/src/core/types.ts';

      const log = (line) => {
        document.getElementById('log').textContent += `${line}\n`;
        console.log(`[selftest] ${line}`);
      };
      const checks = [];
      window.addEventListener('error', (event) => log(`page error: ${event.message}`));
      window.addEventListener('unhandledrejection', (event) => log(`rejected promise: ${event.reason}`));
      const check = (name, condition) => {
        checks.push({ name, ok: Boolean(condition) });
        log(`${condition ? 'ok  ' : 'FAIL'} ${name}`);
      };

      async function buildFile() {
        const canvas = document.createElement('canvas');
        canvas.width = 300;
        canvas.height = 300;
        const context = canvas.getContext('2d');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, 300, 300);
        context.fillStyle = '#c42b1c';
        context.beginPath();
        context.arc(150, 150, 110, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = '#ffffff';
        context.beginPath();
        context.arc(150, 150, 60, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = '#c42b1c';
        context.fillRect(135, 40, 30, 220);

        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
        document.getElementById('source').src = URL.createObjectURL(blob);
        return new File([blob], 'emblem-test.png', { type: 'image/png' });
      }

      try {
        log('starting');
        const file = await buildFile();
        log('png built');
        const image = await decodeImage(file);
        check('image decoded at 300x300', image.width === 300 && image.height === 300);

        const client = new VectorizerClient();
        log('client created');
        await client.load('test', image, 'emblem-test');
        check('pixels transferred to the worker', image.data.byteLength === 0);

        const started = performance.now();
        const { result } = await client.run('test', DEFAULT_OPTIONS);
        log(`vectorized in ${Math.round(performance.now() - started)} ms`);

        check('at least two paths (ring plus hole)', result.pathCount >= 2);
        check('no invalid coordinate', !/NaN|Infinity/.test(result.svg));
        check('color close to the source red', result.color.startsWith('#C'));
        check('no background in the SVG', !/<rect|<svg[^>]+style/.test(result.svg));
        check('setting replayed without error', (await client.run('test', { ...DEFAULT_OPTIONS, threshold: 90 })).result.pathCount >= 1);

        const rendered = `data:image/svg+xml;utf8,${encodeURIComponent(result.svg)}`;
        const image2 = document.getElementById('result');
        await new Promise((resolve, reject) => {
          image2.onload = resolve;
          image2.onerror = () => reject(new Error('SVG unreadable by the browser'));
          image2.src = rendered;
        });
        check('SVG displayable by the browser', image2.naturalWidth > 0);
        client.dispose();
      } catch (error) {
        check(`exception: ${error.message}`, false);
      }

      // Lets this test run without a UI: ?report=<url> posts the summary as
      // JSON (used by the headless verification script).
      const report = new URLSearchParams(location.search).get('report');
      if (report) {
        navigator.sendBeacon(report, JSON.stringify({ checks, log: document.getElementById('log').textContent }));
      }

      const failed = checks.filter((c) => !c.ok);
      const status = document.getElementById('status');
      status.textContent = failed.length === 0 ? `SELF-TEST OK (${checks.length})` : `SELF-TEST FAILED (${failed.length})`;
      status.className = failed.length === 0 ? 'pass' : 'fail';
      document.title = status.textContent;
    </script>
  </body>
</html>
